name: Fallow

on:
  workflow_dispatch:
  pull_request:

# Cancel in-flight fallow runs for the same PR
concurrency:
  group: fallow-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# pull-requests: write lets the audit action post its sticky comment and the
# health step post/update its own. On fork PRs GITHUB_TOKEN is read-only
# regardless, so comments no-op there (the secure default — no pull_request_target).
permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history so the audit action can derive the PR base diff.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-24-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-24-

      # The health step below runs `pnpm exec fallow`, so deps must be present.
      # The audit action installs its own binary and does not need this.
      - name: Install Dependencies
        run: pnpm install --prefer-offline

      # PR gate. The action auto-scopes to the PR base SHA, emits a verdict,
      # and fails the job only on verdict `fail` (introduced error-severity
      # findings); warn-tier findings stay visible without blocking merge.
      # `comment: true` posts a sticky summary of introduced findings.
      - name: Fallow audit (gate)
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          comment: true

      - name: Fallow health score (report only)
        # Repo-wide health score for trend visibility — NOT a gate. `if: always()`
        # so it reports even when the audit step above fails; `|| true` so a health
        # hiccup never changes the job outcome. The action's own health comment is
        # PR-diff-scoped and cannot show a repo-wide grade, so this stays
        # hand-rolled: it renders the full grade + penalty breakdown the action
        # can't produce.
        #
        # Renders markdown (grade header + penalty breakdown) to fallow-comment.md,
        # consumed by both the step summary and the PR comment. The marker on line 1
        # lets the comment step find and update its sticky comment in place. SHA is
        # templated in here so the comment step needs no extra env.
        id: health
        if: always()
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pnpm exec fallow health --score --format json --quiet 2>/dev/null > health.json || true
          SHA="$SHA" node -e '
            const fs = require("fs");
            const marker = "<!-- fallow-health-score -->";
            let h;
            try { h = JSON.parse(fs.readFileSync("health.json", "utf8")).health_score; } catch {}
            const sha = (process.env.SHA || "").slice(0, 7);
            let md;
            if (!h) {
              md = marker + "\n## 🌱 Fallow Health\n\nScore unavailable for this run.\n";
            } else {
              // Grade emoji gives an at-a-glance read; penalties drive the "why".
              const badge = { A: "🟢", B: "🟢", C: "🟡", D: "🟠", F: "🔴" }[h.grade] || "⚪";
              const labels = {
                unused_deps: "Unused dependencies", unit_size: "Unit size",
                duplication: "Duplication", coupling: "Coupling",
                circular_deps: "Circular dependencies", dead_files: "Dead files",
                dead_exports: "Dead exports", complexity: "Complexity",
                p90_complexity: "Complexity (p90)", maintainability: "Maintainability"
              };
              // Only non-zero penalties, largest first — the actionable list.
              const rows = Object.entries(h.penalties || {})
                .filter(([, v]) => v > 0)
                .sort((a, b) => b[1] - a[1])
                .map(([k, v]) => `| ${labels[k] || k} | −${v.toFixed(1)} |`);
              const table = rows.length
                ? ["| Check | Penalty |", "|:------|--------:|", ...rows].join("\n")
                : "_No penalties — clean across all checks._";
              md = [
                marker,
                `## 🌱 Fallow Health: ${badge} ${h.grade} · ${h.score} / 100`,
                "",
                "What is costing points, repo-wide:",
                "",
                table,
                "",
                `<sub>Repo-wide score for trend visibility — not a merge gate. ` +
                `Watch the grade climb as PRs clean up touched files. Updated each push (\`${sha}\`).</sub>`
              ].join("\n");
            }
            fs.writeFileSync("fallow-comment.md", md + "\n");
            // Plain one-liner for logs + GITHUB_OUTPUT.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `score=${h ? h.score + " (" + h.grade + ")" : "unavailable"}\n`);
          '
          cat fallow-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment health score on PR
        # Sticky comment: one comment per PR, updated in place on every push (found
        # by the hidden marker on line 1 of fallow-comment.md). No-ops outside PRs
        # and on fork PRs where GITHUB_TOKEN is read-only. Failure never affects the
        # job outcome.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- fallow-health-score -->"
          # Update the existing sticky comment if one exists, else create it.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@fallow-comment.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@fallow-comment.md
          fi
