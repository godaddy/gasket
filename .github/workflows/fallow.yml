name: Fallow

on:
  workflow_dispatch:
  pull_request:

# Cancel in-flight fallow runs for the same PR
concurrency:
  group: fallow-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Needed for the health-score step to post/update its PR comment. Read-only
# otherwise. Note: on fork PRs GITHUB_TOKEN is read-only regardless, so the
# comment no-ops there (the secure default — we do not use pull_request_target).
permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Base ref must be present for `fallow audit --base` attribution
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-24-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-24-

      - name: Install Dependencies
        run: pnpm install --prefer-offline

      - name: Fallow audit
        # `github.base_ref` is the bare branch name (e.g. `next`) on pull_request
        # events, which does not resolve in the checkout — only `origin/next` exists,
        # so prefix with `origin/`. On manual workflow_dispatch it is empty; fall back
        # to `next`, the branch PRs target.
        # Passed via env (not inline `${{ }}` in the script) so the branch name can
        # never be interpreted as shell.
        # Exit codes: 0 = no introduced error-severity issues, 1 = introduced
        # error-severity issues (fail the PR), 2 = runtime error (e.g. bad base ref).
        # JSON is printed for reviewer visibility; the exit code is the gate.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/${BASE_REF:-next}"
          echo "Auditing against base ref: $base"
          pnpm exec fallow audit --base "$base" --format json --quiet

      - name: Fallow health score (report only)
        # Repo-wide health score for trend visibility — NOT a gate. `if: always()`
        # so it reports even when the audit step above fails; `|| true` so a health
        # hiccup never changes the job outcome. Watch the grade climb as passive
        # cleanup drains existing findings.
        id: health
        if: always()
        run: |
          score=$(pnpm exec fallow health --score --format json --quiet 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const h=JSON.parse(d).health_score;console.log(h.score+' ('+h.grade+')')}catch(e){console.log('unavailable')}})") || true
          score="${score:-unavailable}"
          echo "Fallow health score: $score"
          echo "**Fallow health score:** $score" >> "$GITHUB_STEP_SUMMARY"
          echo "score=$score" >> "$GITHUB_OUTPUT"

      - name: Comment health score on PR
        # Sticky comment: one comment per PR, updated in place on every push (found
        # by the hidden marker below). No-ops outside PRs and on fork PRs where
        # GITHUB_TOKEN is read-only. Failure never affects the job outcome.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SCORE: ${{ steps.health.outputs.score }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- fallow-health-score -->"
          body="$marker
          **Fallow health score:** ${SCORE:-unavailable}

          <sub>Repo-wide score, reported for trend visibility — not a merge gate. Updated on each push (\`${SHA:0:7}\`).</sub>"

          # Find an existing fallow-health comment by its marker; update it if
          # present, otherwise create one. Keeps a single sticky comment per PR.
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body"
          fi
