name: Fallow

on:
  workflow_dispatch:
  pull_request:

# Cancel in-flight fallow runs for the same PR
concurrency:
  group: fallow-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# pull-requests: write lets the action post/update its sticky PR comments.
# On fork PRs GITHUB_TOKEN is read-only regardless, so the comment no-ops
# there (the secure default — we do not use pull_request_target).
permissions:
  contents: read
  pull-requests: write

jobs:
  fallow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history so the action can derive the PR base diff for
          # audit attribution and hotspot/trend analysis.
          fetch-depth: 0

      # PR gate. The action auto-scopes to the PR base SHA, emits a verdict,
      # and fails the job only on verdict `fail` (introduced error-severity
      # findings); warn-tier findings stay visible without blocking merge.
      # `comment: true` posts a sticky summary. @v2 reads the package.json
      # fallow spec for the analyzer version, so CI and local stay in lockstep.
      - name: Fallow audit (gate)
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          comment: true

      # Repo-wide health score for trend visibility — NOT a gate.
      # `if: always()` so it reports even when the audit gate above fails;
      # `fail-on-issues: false` so health findings never change the job
      # outcome. Posts its own sticky score comment with trend deltas.
      - name: Fallow health score (report only)
        if: always()
        uses: fallow-rs/fallow@v2
        with:
          command: health
          score: true
          trend: true
          save-snapshot: true
          fail-on-issues: false
